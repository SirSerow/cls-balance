name: Phase 6 benchmark checks
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1 torchvision==0.24.1
      - run: python -m pip install -e '.[test]'
      - run: python scripts/freeze_tests.py --check
      - run: python -m pytest -q tests checks
